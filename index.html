<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Me</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 500px;
    margin: 60px auto;
    padding: 0 20px;
    background: #f5f5f5;
  }
  h1 {
    text-align: center;
  }
  form {
    background: #fff;
    padding: 24px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  input, textarea {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  textarea {
    min-height: 100px;
    resize: vertical;
  }
  button {
    padding: 12px;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<h1>Contact Me</h1>

<form id="contactForm">
  <input type="text" id="name" placeholder="Name" required />
  <input type="email" id="email" placeholder="Email" required />
  <input type="text" id="subject" placeholder="Subject" />
  <textarea id="message" placeholder="Message" required></textarea>
  <button type="submit">Send</button>
</form>

<script>
  // Change this to your deployed server URL once it's live, e.g.:
  // https://your-app.up.railway.app/send-whatsapp
  const ENDPOINT = 'http://localhost:3000/send-whatsapp';

  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!name || !message) {
      alert('Please fill in your name and message.');
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, subject, message }),
      });

      if (res.ok) {
        alert("Message sent! I'll get back to you soon.");
        e.target.reset();
      } else {
        const err = await res.json().catch(() => ({}));
        alert('Something went wrong: ' + (err.error || 'Please try again.'));
      }
    } catch (err) {
      alert('Network error. Is the server running on localhost:3000?');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });
</script>

</body>
</html>
