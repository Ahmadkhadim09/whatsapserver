<!--
  Drop this <script> into your portfolio site, right before </body>.
  It assumes your form fields have these id attributes:
    id="name", id="email", id="subject", id="message"
  and your <form> itself has id="contactForm".

  If your actual HTML uses different ids (or only name="" attributes,
  no id=""), tell me the exact markup and I'll adjust this to match.
-->
<script>
  // Change this to your deployed server URL once it's live, e.g.:
  // https://your-app.up.railway.app/send-whatsapp
  const ENDPOINT = 'http://localhost:3000/send-whatsapp';

  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!name || !message) {
      alert('Please fill in your name and message.');
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn ? submitBtn.textContent : null;
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
    }

    try {
      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, subject, message }),
      });

      if (res.ok) {
        alert("Message sent! I'll get back to you soon.");
        e.target.reset();
      } else {
        const err = await res.json().catch(() => ({}));
        alert('Something went wrong: ' + (err.error || 'Please try again.'));
      }
    } catch (err) {
      alert('Network error. Is the server running?');
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    }
  });
</script>
